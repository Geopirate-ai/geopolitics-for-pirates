name: Publicar Geopolitics for Pirates

on:
  schedule:
    - cron: '0 11 * * 1,3,5,0'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar la edición de hoy
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: America/Bogota
        run: |
          python generate.py _site/index.html summary.txt
          {
            echo "summary<<EOF"
            cat summary.txt 2>/dev/null || echo "Nueva edición publicada."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Avisar por email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Nueva edicion — Geopolitics for Pirates"
          to: ${{ secrets.MAIL_TO }}
          from: Geopolitics for Pirates
          body: |
            Se publico una nueva edicion.

            ${{ steps.gen.outputs.summary }}

            Leela aqui: ${{ steps.deployment.outputs.page_url }}
